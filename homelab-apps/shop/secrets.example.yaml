# Template only — DO NOT commit real values.
#
# The live cluster holds these two Secrets in the `shop` namespace. They are
# deliberately NOT in this repo: backend-secret carries an OpenAI API key, a
# JWT signing secret, and a DATABASE_URL with the Postgres password in it.
#
# Create them by hand before syncing the app for the first time:
#
#   kubectl create namespace shop
#   kubectl -n shop create secret generic db-secret \
#     --from-literal=POSTGRES_DB=<db> \
#     --from-literal=POSTGRES_USER=<user> \
#     --from-literal=POSTGRES_PASSWORD=<password> \
#     --from-literal=PGDATA=/var/lib/postgresql/data/pgdata
#
#   kubectl -n shop create secret generic backend-secret \
#     --from-literal=DATABASE_URL=postgresql://<user>:<password>@postgres:5432/<db> \
#     --from-literal=JWT_SECRET=<random-string> \
#     --from-literal=OPENAI_API_KEY=<key>
#
# Once Vault or sealed-secrets is running in the homelab, replace this file
# with a SealedSecret or a VaultStaticSecret so the app becomes fully
# reproducible from Git alone.
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: shop
type: Opaque
stringData:
  POSTGRES_DB: REPLACE_ME
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: shop
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE_ME:REPLACE_ME@postgres:5432/REPLACE_ME
  JWT_SECRET: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
