# Seeds a NEW Postgres volume only.
#
# The postgres image runs everything in /docker-entrypoint-initdb.d exactly
# once -- when the data directory is empty. So:
#   fresh PVC      -> these scripts run, schema + product catalogue rebuilt
#   existing PVC   -> skipped entirely, existing data untouched
#
# This is what makes the app reproducible after a full delete. Transactional
# data (users, orders) is deliberately NOT seeded: it contains e-mail
# addresses and password hashes, and is regenerated by using the app.
#
# Regenerate after a schema change:
#   kubectl exec -n shop deploy/postgres -- sh -c \
#     'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --schema-only --no-owner --no-acl'
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-initdb
  namespace: shop
data:
  01-schema.sql: |
    --
    -- PostgreSQL database dump
    --

    -- Dumped from database version 16.14 (Debian 16.14-1.pgdg12+1)
    -- Dumped by pg_dump version 16.14 (Debian 16.14-1.pgdg12+1)

    SET statement_timeout = 0;
    SET lock_timeout = 0;
    SET idle_in_transaction_session_timeout = 0;
    SET client_encoding = 'UTF8';
    SET standard_conforming_strings = on;
    SELECT pg_catalog.set_config('search_path', '', false);
    SET check_function_bodies = false;
    SET xmloption = content;
    SET client_min_messages = warning;
    SET row_security = off;

    --
    -- Name: vector; Type: EXTENSION; Schema: -; Owner: -
    --

    CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;

    --
    -- Name: EXTENSION vector; Type: COMMENT; Schema: -; Owner: -
    --

    COMMENT ON EXTENSION vector IS 'vector data type and ivfflat and hnsw access methods';

    SET default_tablespace = '';

    SET default_table_access_method = heap;

    --
    -- Name: doc_chunks; Type: TABLE; Schema: public; Owner: -
    --

    CREATE TABLE public.doc_chunks (
        id integer NOT NULL,
        content text NOT NULL,
        source character varying(50) NOT NULL,
        ref_id integer,
        embedding public.vector(1536)
    );

    --
    -- Name: doc_chunks_id_seq; Type: SEQUENCE; Schema: public; Owner: -
    --

    CREATE SEQUENCE public.doc_chunks_id_seq
        AS integer
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    --
    -- Name: doc_chunks_id_seq; Type: SEQUENCE OWNED BY; Schema: public; Owner: -
    --

    ALTER SEQUENCE public.doc_chunks_id_seq OWNED BY public.doc_chunks.id;

    --
    -- Name: order_items; Type: TABLE; Schema: public; Owner: -
    --

    CREATE TABLE public.order_items (
        id integer NOT NULL,
        order_id integer NOT NULL,
        product_id integer NOT NULL,
        quantity integer NOT NULL,
        unit_price_cents integer NOT NULL
    );

    --
    -- Name: order_items_id_seq; Type: SEQUENCE; Schema: public; Owner: -
    --

    CREATE SEQUENCE public.order_items_id_seq
        AS integer
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    --
    -- Name: order_items_id_seq; Type: SEQUENCE OWNED BY; Schema: public; Owner: -
    --

    ALTER SEQUENCE public.order_items_id_seq OWNED BY public.order_items.id;

    --
    -- Name: orders; Type: TABLE; Schema: public; Owner: -
    --

    CREATE TABLE public.orders (
        id integer NOT NULL,
        user_id integer NOT NULL,
        status character varying(20) NOT NULL,
        total_cents integer NOT NULL,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Name: orders_id_seq; Type: SEQUENCE; Schema: public; Owner: -
    --

    CREATE SEQUENCE public.orders_id_seq
        AS integer
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    --
    -- Name: orders_id_seq; Type: SEQUENCE OWNED BY; Schema: public; Owner: -
    --

    ALTER SEQUENCE public.orders_id_seq OWNED BY public.orders.id;

    --
    -- Name: products; Type: TABLE; Schema: public; Owner: -
    --

    CREATE TABLE public.products (
        id integer NOT NULL,
        name character varying(200) NOT NULL,
        description text NOT NULL,
        category character varying(50) NOT NULL,
        price_cents integer NOT NULL,
        image_url character varying(500) NOT NULL,
        stock integer NOT NULL,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Name: products_id_seq; Type: SEQUENCE; Schema: public; Owner: -
    --

    CREATE SEQUENCE public.products_id_seq
        AS integer
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    --
    -- Name: products_id_seq; Type: SEQUENCE OWNED BY; Schema: public; Owner: -
    --

    ALTER SEQUENCE public.products_id_seq OWNED BY public.products.id;

    --
    -- Name: users; Type: TABLE; Schema: public; Owner: -
    --

    CREATE TABLE public.users (
        id integer NOT NULL,
        email character varying(255) NOT NULL,
        password_hash character varying(255) NOT NULL,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Name: users_id_seq; Type: SEQUENCE; Schema: public; Owner: -
    --

    CREATE SEQUENCE public.users_id_seq
        AS integer
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1;

    --
    -- Name: users_id_seq; Type: SEQUENCE OWNED BY; Schema: public; Owner: -
    --

    ALTER SEQUENCE public.users_id_seq OWNED BY public.users.id;

    --
    -- Name: doc_chunks id; Type: DEFAULT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.doc_chunks ALTER COLUMN id SET DEFAULT nextval('public.doc_chunks_id_seq'::regclass);

    --
    -- Name: order_items id; Type: DEFAULT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.order_items ALTER COLUMN id SET DEFAULT nextval('public.order_items_id_seq'::regclass);

    --
    -- Name: orders id; Type: DEFAULT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.orders ALTER COLUMN id SET DEFAULT nextval('public.orders_id_seq'::regclass);

    --
    -- Name: products id; Type: DEFAULT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.products ALTER COLUMN id SET DEFAULT nextval('public.products_id_seq'::regclass);

    --
    -- Name: users id; Type: DEFAULT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.users ALTER COLUMN id SET DEFAULT nextval('public.users_id_seq'::regclass);

    --
    -- Name: doc_chunks doc_chunks_pkey; Type: CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.doc_chunks
        ADD CONSTRAINT doc_chunks_pkey PRIMARY KEY (id);

    --
    -- Name: order_items order_items_pkey; Type: CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.order_items
        ADD CONSTRAINT order_items_pkey PRIMARY KEY (id);

    --
    -- Name: orders orders_pkey; Type: CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.orders
        ADD CONSTRAINT orders_pkey PRIMARY KEY (id);

    --
    -- Name: products products_pkey; Type: CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.products
        ADD CONSTRAINT products_pkey PRIMARY KEY (id);

    --
    -- Name: users users_pkey; Type: CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.users
        ADD CONSTRAINT users_pkey PRIMARY KEY (id);

    --
    -- Name: ix_order_items_order_id; Type: INDEX; Schema: public; Owner: -
    --

    CREATE INDEX ix_order_items_order_id ON public.order_items USING btree (order_id);

    --
    -- Name: ix_orders_user_id; Type: INDEX; Schema: public; Owner: -
    --

    CREATE INDEX ix_orders_user_id ON public.orders USING btree (user_id);

    --
    -- Name: ix_products_category; Type: INDEX; Schema: public; Owner: -
    --

    CREATE INDEX ix_products_category ON public.products USING btree (category);

    --
    -- Name: ix_users_email; Type: INDEX; Schema: public; Owner: -
    --

    CREATE UNIQUE INDEX ix_users_email ON public.users USING btree (email);

    --
    -- Name: order_items order_items_order_id_fkey; Type: FK CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.order_items
        ADD CONSTRAINT order_items_order_id_fkey FOREIGN KEY (order_id) REFERENCES public.orders(id);

    --
    -- Name: order_items order_items_product_id_fkey; Type: FK CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.order_items
        ADD CONSTRAINT order_items_product_id_fkey FOREIGN KEY (product_id) REFERENCES public.products(id);

    --
    -- Name: orders orders_user_id_fkey; Type: FK CONSTRAINT; Schema: public; Owner: -
    --

    ALTER TABLE ONLY public.orders
        ADD CONSTRAINT orders_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.users(id);

